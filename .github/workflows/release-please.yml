name: Prepare release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: prepare-release
  cancel-in-progress: true

permissions: {}

jobs:
  release-please:
    if: >-
      ${{
        github.repository == 'tomatoaiu/agent-command-guard' &&
        github.actor == github.repository_owner
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release baseline
        id: baseline
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(jq -er '.["."]' .release-please-manifest.json)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid release manifest version: $version" >&2
            exit 1
          fi

          if gh release view "v${version}" >/dev/null 2>&1; then
            ready=true
          else
            release_count=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=1" \
              --jq 'length')
            if [[ "$version" == "0.0.0" && "$release_count" == "0" ]]; then
              ready=true
            else
              echo "Release v${version} does not exist; skipping release preparation."
              ready=false
            fi
          fi
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"
      - name: Create or update release pull request
        if: steps.baseline.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ github.token }}
